<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 400px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      color: #667eea;
      font-size: 32px;
      margin-bottom: 20px;
      text-align: center;
    }
    .account {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin: 15px 0;
    }
    .account-name {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    .account-balance {
      font-size: 28px;
      font-weight: 700;
      color: #667eea;
    }
    .total {
      background: #667eea;
      color: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      margin-top: 20px;
    }
    .total-label {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 8px;
    }
    .total-amount {
      font-size: 36px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏦 Your Account Balance</h1>
    
    <div class="account">
      <div class="account-name">💳 Checking Account (****4521)</div>
      <div class="account-balance">$3,245.67 CAD</div>
    </div>
    
    <div class="account">
      <div class="account-name">💰 Savings Account (****8892)</div>
      <div class="account-balance">$12,890.32 CAD</div>
    </div>
    
    <div class="total">
      <div class="total-label">Total Balance</div>
      <div class="total-amount">$16,135.99 CAD</div>
    </div>
  </div>
  
  <script>
    // Minimal script - just confirm it loaded
    console.log("✅ Banking widget rendered successfully!");
  </script>
</body>
</html>
